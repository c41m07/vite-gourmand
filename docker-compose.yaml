name: vite-gourmand

networks:
  mail_network:
    name: mail_network
    external: true
  backend:
  traefik_network:
    name: traefik_network
    external: true

services:
  app:
    container_name: vite-gourmand-web
    image: local/vite-gourmand-web:dev
    build:
      context: docker/php/dev
    volumes:
      - ./app:/var/www/html
    networks:
      mail_network: {}
      backend:
        aliases: [ecf_vite_gourmand_app]
      traefik_network:
        aliases: [ecf_vite_gourmand_app]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.app.entrypoints=web"
      - "traefik.http.routers.app.rule=Host(`${TRAEFIK_URL_APP}`)"
      - "traefik.http.services.app.loadbalancer.server.port=80"
      - "traefik.docker.network=traefik_network"
    depends_on:
      database:
        condition: service_healthy

  database:
    container_name: vite-gourmand-database
    image: mariadb
    environment:
      MARIADB_ROOT_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      # Données applicatives existantes vérifiées et sauvegardées avant bascule.
      - /home/caim/Projets/studi/ECF/vite-gourmand/mariadb:/var/lib/mysql
    networks:
      backend:
        aliases: [ecf_vite_gourmand_database]
    ports:
      - "${DATABASE_PORT}:3306"
    healthcheck:
      test: [ "CMD-SHELL", "mariadb -h localhost -u root -p$${MARIADB_ROOT_PASSWORD} -e 'SELECT 1' || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
